<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopewaves | Afiliado Exemplo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .affiliate-hero {
            min-height: 70vh;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .affiliate-badge {
            background: rgba(138, 43, 226, 0.2);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(138, 43, 226, 0.4);
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="bg-wrapper">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <nav class="glass-nav">
        <div class="container nav-content">
            <div class="logo">Hope<span>waves</span></div>
            <ul class="nav-links">
                <li><a href="../">Voltar para a Home</a></li>
                <li><a href="#" class="btn-primary">Inscreva-se Agora</a></li>
            </ul>
        </div>
    </nav>

    <main class="affiliate-hero container" id="home">
        <div class="animate-up">
            <div class="affiliate-badge">Página de Afiliado Parceiro</div>
            <h1>Aumente Seus Resultados com <span>Hopewaves</span></h1>
            <p style="max-width: 600px; margin: 1.5rem auto; color: var(--text-muted); font-size: 1.2rem;">
                Você foi convidado(a) para conhecer a plataforma definitiva de crescimento e networking. Converta mais, trabalhe menos.
            </p>
            <div style="margin-top: 2rem;">
                <a href="#" class="btn-primary" style="font-size: 1.1rem; padding: 1rem 2.5rem;">Acessar Oferta Exclusiva</a>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="/js/seo-injector.js"></script>
</body>
</html>
