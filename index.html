<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopewaves | Conectando o Futuro</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="description" content="Hopewaves - Uma plataforma premium para seus programas de afiliados.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="bg-wrapper">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <nav class="glass-nav">
        <div class="container nav-content">
            <div class="logo">Hope<span>waves</span></div>
            <ul class="nav-links">
                <li><a href="#home">Início</a></li>
                <li><a href="#about">Sobre</a></li>
                <li><a href="#affiliates">Rede de Afiliados</a></li>
                <li><a href="#contact" class="btn-primary">Contato</a></li>
            </ul>
        </div>
    </nav>

    <main class="hero" id="home">
        <div class="container hero-content">
            <h1 class="animate-up">A Onda de Esperança para o seu <span>Negócio</span></h1>
            <p class="animate-up delay-1">Expanda seus horizontes com a nossa rede premium de afiliados. Conecte-se, cresça e alcance resultados extraordinários.</p>
            <div class="hero-actions animate-up delay-2">
                <a href="#affiliates" class="btn-primary">Conhecer a Rede</a>
                <a href="exemplo/" class="btn-secondary">Página de Exemplo</a>
            </div>
        </div>
        <div class="hero-image-wrapper animate-up delay-3">
            <img src="assets/hero_bg.png" alt="Hopewaves Background" class="hero-image">
            <div class="glass-card floating-card">
                <div class="card-icon">🌊</div>
                <div class="card-text">
                    <strong>+150%</strong>
                    <span>Crescimento de conversão</span>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/seo-injector.js"></script>
</body>
</html>
